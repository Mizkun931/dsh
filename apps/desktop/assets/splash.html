<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek</title>
    <style>
      :root {
        color-scheme: dark;
        --surface: #060a14;
        --surface-deep: #02040a;
        --text: #f7fbff;
        --muted: #9bb4cf;
        --line: rgb(247 251 255 / 12%);
        --accent: #5aa7ff;
        --accent-strong: #8fd0ff;
        --accent-soft: rgb(90 167 255 / 18%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--text);
        background:
          radial-gradient(circle at 46% 42%, var(--accent-soft), transparent 42%),
          linear-gradient(145deg, var(--surface), var(--surface-deep));
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
        user-select: none;
      }

      .scene {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        opacity: 1;
        transform: scale(1);
      }

      .lockup {
        display: grid;
        gap: 24px;
        justify-items: center;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .logo-frame {
        width: 78px;
        height: 78px;
        display: grid;
        place-items: center;
        border-radius: 24px;
        background:
          radial-gradient(circle at 36% 30%, rgb(255 255 255 / 18%), transparent 36%),
          rgb(90 167 255 / 10%);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 16%),
          0 18px 60px rgb(0 0 0 / 38%);
        animation: logo-pop 720ms cubic-bezier(0.16, 1, 0.3, 1) both 80ms;
      }

      .logo {
        width: 46px;
        height: 46px;
        display: block;
        filter: drop-shadow(0 10px 20px rgb(90 167 255 / 24%));
      }

      .copy {
        display: grid;
        gap: 5px;
        min-width: 170px;
      }

      .wordmark {
        color: var(--text);
        font-size: 34px;
        line-height: 38px;
        font-weight: 720;
        letter-spacing: 0;
        animation: word-pop 620ms cubic-bezier(0.16, 1, 0.3, 1) both 180ms;
      }

      .tagline {
        color: var(--muted);
        font-size: 15px;
        line-height: 22px;
        font-weight: 450;
        letter-spacing: 0;
        animation: tagline-in 560ms cubic-bezier(0.16, 1, 0.3, 1) both 320ms;
      }

      .progress {
        width: 266px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--line);
      }

      .progress-fill {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-strong));
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 260ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      body[data-state="closing"] .scene {
        opacity: 0;
        transform: scale(0.985);
        filter: blur(6px);
        transition:
          opacity 320ms cubic-bezier(0.4, 0, 0.2, 1),
          transform 320ms cubic-bezier(0.4, 0, 0.2, 1),
          filter 320ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      body[data-state="error"] .progress-fill {
        background: #ef4444;
        box-shadow: none;
      }

      @keyframes logo-pop {
        0% {
          opacity: 0;
          transform: translateY(8px) scale(0.78) rotate(-6deg);
          filter: blur(10px);
        }
        72% {
          opacity: 1;
          transform: translateY(0) scale(1.045) rotate(1deg);
          filter: blur(0);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1) rotate(0);
          filter: blur(0);
        }
      }

      @keyframes word-pop {
        from {
          opacity: 0;
          transform: translateX(-10px);
          filter: blur(8px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
          filter: blur(0);
        }
      }

      @keyframes tagline-in {
        from {
          opacity: 0;
          transform: translateY(7px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .logo-frame,
        .wordmark,
        .tagline {
          animation: none;
        }

        .progress-fill {
          transition: none;
        }

        body[data-state="closing"] .scene {
          filter: none;
          transition: opacity 180ms ease;
        }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <section class="lockup">
        <div class="brand">
          <div class="logo-frame" aria-hidden="true">
            <img class="logo" src="./logo.svg" alt="" />
          </div>
          <div class="copy">
            <div class="wordmark">DeepSeek</div>
            <div class="tagline">探索未至之境</div>
          </div>
        </div>
        <div class="progress" aria-hidden="true">
          <span class="progress-fill" data-progress></span>
        </div>
      </section>
    </main>
    <script>
      const progressFill = document.querySelector("[data-progress]");

      window.setDeepSeekSplashProgress = value => {
        const numeric = Number(value);
        const percent = Number.isFinite(numeric) ? Math.min(100, Math.max(0, numeric)) : 0;
        progressFill.style.transform = `scaleX(${percent / 100})`;
      };
    </script>
  </body>
</html>
