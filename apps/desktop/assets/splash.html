<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: light;
        --surface: #fbfdff;
        --surface-soft: #f3f7fc;
        --ink: #1a2230;
        --line: rgb(77 107 254 / 12%);
        --brand: #4d6bfe;
        --brand-sky: #25a8ff;
        --brand-glow: rgb(77 107 254 / 30%);
        --glass: rgb(74 82 94 / 62%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 50% 38%, rgb(77 107 254 / 13%), transparent 32vmax),
          radial-gradient(circle at 50% 76%, rgb(37 168 255 / 9%), transparent 30vmax),
          linear-gradient(180deg, #ffffff, var(--surface));
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
        user-select: none;
      }

      .scene {
        width: 100%;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: clamp(24px, 7vmin, 84px);
        opacity: 1;
        transform: scale(1);
      }

      .lockup {
        display: grid;
        gap: clamp(28px, 5.8vh, 58px);
        justify-items: center;
        transform: translateY(clamp(-18px, -2.8vh, -8px));
      }

      .brand-row {
        max-width: 92vw;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(7px, 1.45vmin, 16px);
        filter: drop-shadow(0 20px 54px rgb(27 45 104 / 14%));
      }

      .brand-piece {
        display: inline-grid;
        place-items: center;
        opacity: 0;
        transform: translateY(16px) scale(0.76);
        animation: brand-pop 760ms cubic-bezier(0.16, 1, 0.3, 1) both;
        will-change: transform, opacity;
      }

      .icon-piece {
        animation-delay: 120ms;
      }

      .word-piece {
        animation-delay: 360ms;
      }

      .harness-piece {
        animation-delay: 590ms;
      }

      .deepseek-icon,
      .deepseek-wordmark {
        display: block;
        object-fit: contain;
        filter:
          drop-shadow(0 7px 16px rgb(77 107 254 / 22%))
          drop-shadow(0 9px 24px var(--brand-glow));
      }

      .deepseek-icon {
        width: clamp(43px, 7.6vmin, 76px);
        aspect-ratio: 39 / 33;
      }

      .deepseek-wordmark {
        width: clamp(166px, 29vmin, 286px);
        aspect-ratio: 141 / 33;
      }

      .harness-badge {
        position: relative;
        display: inline-grid;
        min-height: clamp(29px, 4.7vmin, 45px);
        place-items: center;
        overflow: hidden;
        isolation: isolate;
        border-radius: 999px;
        padding: 0 clamp(13px, 2.2vmin, 22px);
        color: #ffffff;
        background:
          radial-gradient(circle at 28% 10%, rgb(255 255 255 / 46%), transparent 36%),
          linear-gradient(145deg, rgb(255 255 255 / 24%), rgb(255 255 255 / 7%)),
          var(--glass);
        -webkit-backdrop-filter: blur(18px) saturate(170%) contrast(1.04);
        backdrop-filter: blur(18px) saturate(170%) contrast(1.04);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 44%),
          inset 0 -1px 0 rgb(255 255 255 / 12%),
          0 14px 34px rgb(40 50 66 / 18%),
          0 9px 30px rgb(77 107 254 / 14%);
        font-size: clamp(0.875rem, 2.25vmin, 1.375rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0;
        text-shadow: 0 1px 6px rgb(0 0 0 / 24%);
        white-space: nowrap;
      }

      .harness-badge::before {
        content: "";
        position: absolute;
        inset: 1px;
        z-index: -1;
        border-radius: inherit;
        background:
          linear-gradient(90deg, rgb(255 255 255 / 30%), transparent 45%, rgb(255 255 255 / 18%)),
          radial-gradient(circle at 70% 0%, rgb(255 255 255 / 22%), transparent 42%);
        pointer-events: none;
      }

      .progress {
        width: min(46vw, 420px);
        min-width: min(260px, 70vw);
        height: clamp(3px, 0.44vmin, 5px);
        overflow: hidden;
        border-radius: 999px;
        background: var(--line);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 70%),
          0 15px 36px rgb(77 107 254 / 10%);
      }

      .progress-fill {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--brand), var(--brand-sky));
        box-shadow: 0 7px 18px rgb(77 107 254 / 28%);
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 260ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      body[data-state="closing"] .scene {
        opacity: 0;
        transform: scale(0.985);
        filter: blur(8px);
        transition:
          opacity 320ms cubic-bezier(0.4, 0, 0.2, 1),
          transform 320ms cubic-bezier(0.4, 0, 0.2, 1),
          filter 320ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      body[data-state="error"] .progress-fill {
        background: #ef4444;
        box-shadow: none;
      }

      @keyframes brand-pop {
        0% {
          opacity: 0;
          transform: translateY(16px) scale(0.76);
          filter: blur(10px);
        }
        64% {
          opacity: 1;
          transform: translateY(-3px) scale(1.08);
          filter: blur(0);
        }
        82% {
          opacity: 1;
          transform: translateY(1px) scale(0.97);
          filter: blur(0);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      @media (max-width: 560px) {
        .brand-row {
          gap: clamp(5px, 1.8vw, 9px);
        }

        .deepseek-icon {
          width: clamp(36px, 9.8vw, 48px);
        }

        .deepseek-wordmark {
          width: clamp(136px, 38vw, 176px);
        }

        .harness-badge {
          min-height: clamp(25px, 7vw, 32px);
          padding-inline: clamp(10px, 3vw, 14px);
        }

        .progress {
          min-width: min(230px, 76vw);
        }
      }

      @media (max-height: 420px) {
        .scene {
          padding-block: 20px;
        }

        .lockup {
          gap: 22px;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .brand-piece {
          opacity: 1;
          transform: none;
          animation: none;
          filter: none;
        }

        .progress-fill {
          transition: none;
        }

        body[data-state="closing"] .scene {
          filter: none;
          transition: opacity 180ms ease;
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        .harness-badge {
          background: rgb(72 82 96 / 92%);
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <section class="lockup" aria-label="DeepSeek Harness">
        <div class="brand-row">
          <span class="brand-piece icon-piece" aria-hidden="true">
            <img class="deepseek-icon" src="./deepseek-icon-blue.png" alt="" />
          </span>
          <span class="brand-piece word-piece" aria-hidden="true">
            <img class="deepseek-wordmark" src="./deepseek-wordmark-blue.png" alt="" />
          </span>
          <span class="brand-piece harness-piece">
            <span class="harness-badge">Harness</span>
          </span>
        </div>
        <div class="progress" aria-hidden="true">
          <span class="progress-fill" data-progress></span>
        </div>
      </section>
    </main>
    <script>
      const progressFill = document.querySelector("[data-progress]");

      window.setDeepSeekSplashProgress = value => {
        const numeric = Number(value);
        const percent = Number.isFinite(numeric) ? Math.min(100, Math.max(0, numeric)) : 0;
        progressFill.style.transform = `scaleX(${percent / 100})`;
      };
    </script>
  </body>
</html>
